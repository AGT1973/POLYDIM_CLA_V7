[package]
name = "polydim_verify"
version = "0.7.62"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# A7: catch_unwind exige panic="unwind". Con abort, capturar en la frontera FFI
# es imposible y el proceso muere. Se fija explicitamente en ambos perfiles.
[profile.release]
panic = "unwind"
overflow-checks = true
codegen-units = 1
